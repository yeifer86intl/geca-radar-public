name: GECA Radar diario (histórico público)
on:
  schedule:
    - cron: '17 7 * * *' # Radar Steam: 07:17 España (Europe/Madrid; verano/invierno automaticos)
      timezone: Europe/Madrid
  workflow_dispatch:
    inputs:
      inicializar_desde_respaldo:
        description: "Solo primer arranque del repositorio nuevo; nunca durante operación normal"
        required: false
        type: boolean
        default: false
permissions:
  contents: write # Publicar release y checkpoints dentro del mismo repositorio
  actions: read
concurrency:
  group: geca-radar-estado
  cancel-in-progress: false
jobs:
  radar:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      KEDRO_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install -e ".[test]"
          python -m pip install "openpyxl>=3.1,<4"
      - name: Verificar que esta desplegada la correccion CSV.GZ
        run: |
          python scripts/verify_export_mode.py
          git log -1 --format="Commit ejecutado: %h %s"
      - name: Ejecutar pruebas
        run: python -m pytest -q
      - name: Restaurar histórico acumulativo
        env:
          PRIMER_ARRANQUE: ${{ inputs.inicializar_desde_respaldo || 'false' }}
        run: |
          if [ "$PRIMER_ARRANQUE" = "true" ]; then
            python scripts/restore_light_state.py --inicializar
          else
            python scripts/restore_light_state.py
          fi
      - name: Copia de seguridad antes de procesar
        run: cp transfer/geca_steam_historico.xlsx transfer/geca_steam_anterior.xlsx
      - name: Ejecutar extracción Steam
        env:
          GECA_CHECKPOINT_TOKEN: ${{ github.token }}
          GECA_CHECKPOINT_REPO: ${{ github.repository }}
          GECA_CHECKPOINT_BATCH: "100"
        run: python -m kedro run --pipeline radar
      - name: Consolidar catálogo sin borrar históricos
        run: python scripts/build_light_catalog.py --results data/04_radar --previous transfer/geca_steam_historico.xlsx --out transfer/geca_steam_historico.xlsx
      - name: Exportar solo cambios Steam
        run: |
          python scripts/export_steam_delta.py \
            --before transfer/geca_steam_anterior.xlsx \
            --after transfer/geca_steam_historico.xlsx \
            --repo "${{ github.repository }}" \
            --run "${{ github.run_id }}" \
            --out outputs/delta/steam_delta.jsonl.gz
      - name: Publicar incremento Steam
        uses: actions/upload-artifact@v4
        with:
          name: geca-steam-delta
          path: outputs/delta/steam_delta.jsonl.gz
          if-no-files-found: error
          retention-days: 7
      - name: Publicar catálogo público persistente
        run: python scripts/publish_public_state.py
      - name: Publicar catálogo para Twitch
        uses: actions/upload-artifact@v4
        with:
          name: geca-steam-catalog
          path: transfer/geca_steam_historico.xlsx
          retention-days: 30
          if-no-files-found: error
      - name: Publicar resultados diarios
        uses: actions/upload-artifact@v4
        with:
          name: resultados-radar
          path: |
            data/04_radar/**/*.csv.gz
            data/04_radar/**/*.csv
            data/04_radar/**/resumen.json
            data/04_radar/**/resumen.md
          retention-days: 30
          if-no-files-found: error
