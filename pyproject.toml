[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-pipeline"
version = "0.1.0"
description = "Descarga de próximos juegos, reseñas y fichas de Steam con Kedro"
requires-python = ">=3.10"
dependencies = ["kedro==1.4.0", "kedro-datasets[pandas-csv,json]>=7,<10", "pandas>=2.2,<3", "tzdata>=2025.1", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.kedro]
package_name = "steam_pipeline"
project_name = "Steam Pipeline"
kedro_init_version = "1.4.0"
source_dir = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.kedro_telemetry]
project_id = "54fdbb74ff0f4419839fdcd92113b253"
